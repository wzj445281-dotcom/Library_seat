<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>智座 - 资源入库管理</title>
    <!-- 引入 Vue 和 ElementUI -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #f0f2f5; font-family: "Helvetica Neue",Helvetica,"PingFang SC",Arial,sans-serif; }
        .header { background: #fff; padding: 0 20px; box-shadow: 0 1px 4px rgba(0,21,41,.08); display: flex; justify-content: space-between; align-items: center; height: 60px; }
        .main-container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .card-box { background: #fff; padding: 20px; border-radius: 4px; margin-bottom: 20px; }
        .avatar-uploader .el-upload { border: 1px dashed #d9d9d9; border-radius: 6px; cursor: pointer; position: relative; overflow: hidden; }
        .avatar-uploader .el-upload:hover { border-color: #409EFF; }
        .avatar-uploader-icon { font-size: 28px; color: #8c939d; width: 120px; height: 160px; line-height: 160px; text-align: center; }
        .avatar { width: 120px; height: 160px; display: block; object-fit: cover; }
        .filter-area { display: flex; gap: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>
<div id="app">
    <div class="header">
        <h2 style="margin:0; color:#1890ff;">📚 智座资源管理中台</h2>
        <el-button type="text" @click="goHome">返回首页</el-button>
    </div>

    <div class="main-container">
        <!-- 操作栏 -->
        <div class="card-box">
            <div class="filter-area">
                <el-input v-model="searchKey" placeholder="搜索书名/ISBN/作者" style="width: 300px;" clearable @clear="fetchData"></el-input>
                <el-button type="primary" icon="el-icon-search" @click="fetchData">查询</el-button>
                <el-button type="success" icon="el-icon-plus" @click="openCreateModal">新增资源入库</el-button>
            </div>
        </div>

        <!-- 数据表格 -->
        <div class="card-box">
            <el-table :data="tableData" stripe style="width: 100%" v-loading="loading">
                <el-table-column prop="id" label="ID" width="80"></el-table-column>
                <el-table-column label="封面" width="100">
                    <template slot-scope="scope">
                        <img :src="scope.row.imgUrl || 'https://via.placeholder.com/80x100?text=No+Img'" style="width: 60px; height: 80px; border-radius: 4px;">
                    </template>
                </el-table-column>
                <el-table-column prop="name" label="资源名称/书名" min-width="180"></el-table-column>
                <el-table-column label="类型" width="100">
                    <template slot-scope="scope">
                        <el-tag :type="scope.row.type === 0 ? 'primary' : 'warning'">
                            {{ scope.row.type === 0 ? '图书' : (scope.row.type === 1 ? '雨伞' : '充电宝') }}
                        </el-tag>
                    </template>
                </el-table-column>
                <el-table-column prop="locationCode" label="索书号/库位" width="150"></el-table-column>
                <el-table-column label="库存" width="120">
                    <template slot-scope="scope">
                        <el-tag :type="scope.row.stock > 0 ? 'success' : 'danger'">
                            {{ scope.row.stock }} / {{ scope.row.totalStock }}
                        </el-tag>
                    </template>
                </el-table-column>
                <el-table-column prop="author" label="作者" width="120"></el-table-column>
                <el-table-column label="操作" width="150">
                    <template slot-scope="scope">
                        <el-button size="mini" @click="handleEdit(scope.row)">编辑</el-button>
                        <el-button size="mini" type="danger" plain>下架</el-button>
                    </template>
                </el-table-column>
            </el-table>
        </div>
    </div>

    <!-- 新增/编辑 弹窗 -->
    <el-dialog :title="form.id ? '编辑资源' : '新资源入库'" :visible.sync="dialogVisible" width="600px">
        <el-form :model="form" label-width="100px" ref="dataForm">

            <el-form-item label="封面图片">
                <el-upload
                        class="avatar-uploader"
                        action="/api/admin/resources/upload"
                        :show-file-list="false"
                        :on-success="handleAvatarSuccess"
                        :before-upload="beforeAvatarUpload">
                    <img v-if="form.imgUrl" :src="form.imgUrl" class="avatar">
                    <i v-else class="el-icon-plus avatar-uploader-icon"></i>
                </el-upload>
                <div style="font-size: 12px; color: #999;">点击上传封面，建议比例 3:4</div>
            </el-form-item>

            <el-form-item label="资源类型">
                <el-radio-group v-model="form.type">
                    <el-radio :label="0">图书</el-radio>
                    <el-radio :label="2">充电宝</el-radio>
                    <el-radio :label="1">雨伞</el-radio>
                </el-radio-group>
            </el-form-item>

            <el-form-item label="资源名称" required>
                <el-input v-model="form.name" placeholder="请输入书名或物品名称"></el-input>
            </el-form-item>

            <!-- 图书特有字段 -->
            <div v-if="form.type === 0" style="background: #f9f9f9; padding: 10px; border-radius: 4px; margin-bottom: 20px;">
                <el-row :gutter="20">
                    <el-col :span="12">
                        <el-form-item label="作者">
                            <el-input v-model="form.author"></el-input>
                        </el-form-item>
                    </el-col>
                    <el-col :span="12">
                        <el-form-item label="出版社">
                            <el-input v-model="form.publisher"></el-input>
                        </el-form-item>
                    </el-col>
                </el-row>
                <el-row :gutter="20">
                    <el-col :span="12">
                        <el-form-item label="ISBN">
                            <el-input v-model="form.isbn"></el-input>
                        </el-form-item>
                    </el-col>
                    <el-col :span="12">
                        <el-form-item label="分类">
                            <el-input v-model="form.category" placeholder="如: 计算机/文学"></el-input>
                        </el-form-item>
                    </el-col>
                </el-row>
            </div>

            <el-row :gutter="20">
                <el-col :span="12">
                    <el-form-item label="索书号/库位" required>
                        <el-input v-model="form.locationCode" placeholder="如: A-1-05"></el-input>
                    </el-form-item>
                </el-col>
                <el-col :span="12">
                    <el-form-item label="初始库存" required>
                        <el-input-number v-model="form.stock" :min="1" :max="999"></el-input-number>
                    </el-form-item>
                </el-col>
            </el-row>

        </el-form>
        <span slot="footer" class="dialog-footer">
                <el-button @click="dialogVisible = false">取 消</el-button>
                <el-button type="primary" @click="submitForm">确 定 入 库</el-button>
            </span>
    </el-dialog>
</div>

<script>
    new Vue({
        el: '#app',
        data: {
            loading: false,
            tableData: [],
            searchKey: '',
            dialogVisible: false,
            form: {
                id: null,
                name: '',
                type: 0,
                imgUrl: '',
                author: '',
                publisher: '',
                isbn: '',
                category: '',
                locationCode: '',
                stock: 1,
                totalStock: 1
            }
        },
        created() {
            this.fetchData();
        },
        methods: {
            goHome() {
                window.location.href = '/admin.html';
            },
            fetchData() {
                this.loading = true;
                // 这里复用之前的列表接口，如果没有专门的admin list接口，可以先用这个或者自己加一个
                // 假设复用 app 端的 list 接口，或者 admin 应该有自己的 search 接口
                // 这里为了演示方便，调用 app 接口，实际建议在 AdminResourceController 加一个 /list
                axios.get('/api/app/resources/list?type=' + 0 + '&keyword=' + this.searchKey)
                    .then(res => {
                        if (res.data.code === 200) {
                            this.tableData = res.data.data;
                        } else {
                            this.$message.error(res.data.message);
                        }
                    })
                    .finally(() => this.loading = false);
            },
            openCreateModal() {
                this.form = { type: 0, stock: 1, totalStock: 1, imgUrl: '' }; // 重置表单
                this.dialogVisible = true;
            },
            handleEdit(row) {
                this.form = JSON.parse(JSON.stringify(row));
                this.dialogVisible = true;
            },
            handleAvatarSuccess(res, file) {
                if (res.code === 200) {
                    this.form.imgUrl = res.data; // 后端返回的 URL
                    this.$message.success('图片上传成功');
                } else {
                    this.$message.error('上传失败: ' + res.message);
                }
            },
            beforeAvatarUpload(file) {
                const isJPG = file.type === 'image/jpeg' || file.type === 'image/png';
                const isLt2M = file.size / 1024 / 1024 < 2;

                if (!isJPG) {
                    this.$message.error('上传头像图片只能是 JPG/PNG 格式!');
                }
                if (!isLt2M) {
                    this.$message.error('上传头像图片大小不能超过 2MB!');
                }
                return isJPG && isLt2M;
            },
            submitForm() {
                if (!this.form.name || !this.form.locationCode) {
                    this.$message.warning('请填写名称和库位信息');
                    return;
                }

                // 确保总库存跟当前库存同步（如果是新增）
                if (!this.form.id) {
                    this.form.totalStock = this.form.stock;
                }

                const method = this.form.id ? 'put' : 'post';
                const url = this.form.id ? `/api/admin/resources/${this.form.id}` : '/api/admin/resources';

                axios[method](url, this.form).then(res => {
                    if (res.data.code === 200) {
                        this.$message.success('操作成功');
                        this.dialogVisible = false;
                        this.fetchData();
                    } else {
                        this.$message.error(res.data.message);
                    }
                });
            }
        }
    });
</script>
</body>
</html>
