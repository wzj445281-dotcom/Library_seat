<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>智座 - 运营管理后台</title>
    <!-- 引入样式 -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <!-- 新增: 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; }
        #app { height: 100%; }
        .el-header { background-color: #001529; color: #fff; line-height: 60px; display: flex; justify-content: space-between; }
        .el-aside { background-color: #001529; color: #333; height: 100%; }
        .el-main { background-color: #f0f2f5; padding: 20px; }
        .logo { font-size: 20px; font-weight: bold; color: #1890ff; margin-right: 20px; }
        .stat-card { text-align: center; padding: 20px 0; }
        .stat-num { font-size: 24px; font-weight: bold; color: #1890ff; margin-top: 10px; }

        /* 菜单样式微调 */
        .el-menu { border-right: none; }
        .el-menu-item { color: rgba(255,255,255,0.65); }
        .el-menu-item:hover, .el-menu-item.is-active { background-color: #1890ff !important; color: #fff; }
    </style>
</head>
<body>
<div id="app">
    <el-container style="height: 100%;">
        <el-header>
            <div style="display: flex; align-items: center;">
                <span class="logo">智座 SmartSeat</span>
                <span style="font-size: 14px; color: rgba(255,255,255,0.65);">高校图书馆智能运营平台</span>
            </div>
            <div>
                <el-dropdown>
                    <span style="color: #fff; cursor: pointer;"> 管理员 <i class="el-icon-arrow-down"></i> </span>
                    <el-dropdown-menu slot="dropdown">
                        <el-dropdown-item>个人中心</el-dropdown-item>
                        <el-dropdown-item divided>退出登录</el-dropdown-item>
                    </el-dropdown-menu>
                </el-dropdown>
            </div>
        </el-header>

        <el-container>
            <el-aside width="220px">
                <el-menu default-active="1" background-color="#001529" text-color="#fff" active-text-color="#409EFF">
                    <el-menu-item index="1">
                        <i class="el-icon-s-home"></i>
                        <span slot="title">总览仪表盘</span>
                    </el-menu-item>

                    <!-- 资源管理入口 -->
                    <el-menu-item index="2" @click="goToPage('resource_manage.html')">
                        <i class="el-icon-reading"></i>
                        <span slot="title">资源入库/库存</span>
                    </el-menu-item>

                    <el-menu-item index="3" @click="goToPage('monitor.html')">
                        <i class="el-icon-monitor"></i>
                        <span slot="title">实时座位监控</span>
                    </el-menu-item>

                    <el-menu-item index="4" @click="goToPage('feedback_manage.html')">
                        <i class="el-icon-chat-dot-square"></i>
                        <span slot="title">用户反馈处理</span>
                    </el-menu-item>

                    <!-- 新增：借阅履约订单入口 -->
                    <el-menu-item index="5" @click="goToPage('order_manage.html')">
                        <i class="el-icon-s-order"></i>
                        <span slot="title">借阅履约订单</span>
                    </el-menu-item>
                </el-menu>
            </el-aside>

            <el-main>
                <!-- 仪表盘内容 -->
                <el-row :gutter="20" style="margin-bottom: 20px;">
                    <el-col :span="6">
                        <el-card shadow="hover" class="stat-card">
                            <div style="color: #666;">今日预约</div>
                            <div class="stat-num">{{ stats.todayReservations || 0 }}</div>
                        </el-card>
                    </el-col>
                    <el-col :span="6">
                        <el-card shadow="hover" class="stat-card">
                            <div style="color: #666;">当前入座率</div>
                            <div class="stat-num">{{ stats.occupancyRate || '0%' }}</div>
                        </el-card>
                    </el-col>
                    <el-col :span="6">
                        <el-card shadow="hover" class="stat-card">
                            <div style="color: #666;">违规记录</div>
                            <div class="stat-num" style="color: #ff4d4f;">{{ stats.violations || 0 }}</div>
                        </el-card>
                    </el-col>
                    <el-col :span="6">
                        <el-card shadow="hover" class="stat-card">
                            <div style="color: #666;">待处理反馈</div>
                            <div class="stat-num" style="color: #faad14;">{{ stats.pendingFeedback || 0 }}</div>
                        </el-card>
                    </el-col>
                </el-row>

                <el-card shadow="never">
                    <div slot="header">
                        <span>📅 近七日预约趋势</span>
                    </div>
                    <!-- 修改: 增加 ID 用于 ECharts 渲染 -->
                    <div id="trendChart" style="height: 350px;"></div>
                </el-card>

                <div style="margin-top: 20px; text-align: center; color: #999; font-size: 12px;">
                    © 2025 SmartSeat Admin System V2.1
                </div>
            </el-main>
        </el-container>
    </el-container>
</div>

<script>
    new Vue({
        el: '#app',
        data: {
            stats: {
                todayReservations: 128,
                occupancyRate: '85%',
                violations: 3,
                pendingFeedback: 5
            },
            chartInstance: null
        },
        created() {
            this.fetchStats();
        },
        mounted() {
            // 页面挂载后初始化图表
            this.initChart();
            window.addEventListener('resize', this.handleResize);
        },
        beforeDestroy() {
            window.removeEventListener('resize', this.handleResize);
            if (this.chartInstance) {
                this.chartInstance.dispose();
            }
        },
        methods: {
            goToPage(page) {
                window.location.href = page;
            },
            fetchStats() {
                // 模拟从后端获取数据
                axios.get('/api/admin/stats/overview').then(res => {
                    if(res.data.code === 200) {
                        this.stats = res.data.data;
                        // 如果后端返回了图表数据，可以在这里调用 updateChart(res.data.chartData)
                    }
                }).catch(e => {
                    console.log('Mock mode used: API not connected');
                    // 即使API失败，我们也保留默认值，不影响演示
                });
            },
            initChart() {
                const chartDom = document.getElementById('trendChart');
                this.chartInstance = echarts.init(chartDom);

                const option = {
                    tooltip: {
                        trigger: 'axis'
                    },
                    grid: {
                        left: '3%',
                        right: '4%',
                        bottom: '3%',
                        containLabel: true
                    },
                    xAxis: {
                        type: 'category',
                        boundaryGap: false,
                        data: ['周一', '周二', '周三', '周四', '周五', '周六', '周日']
                    },
                    yAxis: {
                        type: 'value'
                    },
                    series: [
                        {
                            name: '预约人次',
                            type: 'line',
                            stack: 'Total',
                            smooth: true,
                            data: [120, 132, 101, 134, 90, 230, 210],
                            itemStyle: { color: '#1890ff' },
                            areaStyle: { color: 'rgba(24,144,255,0.1)' }
                        },
                        {
                            name: '实际入座',
                            type: 'line',
                            stack: 'Total',
                            smooth: true,
                            data: [110, 120, 95, 124, 85, 200, 190],
                            itemStyle: { color: '#52c41a' }
                        }
                    ]
                };

                this.chartInstance.setOption(option);
            },
            handleResize() {
                if (this.chartInstance) {
                    this.chartInstance.resize();
                }
            }
        }
    });
</script>
</body>
</html>
