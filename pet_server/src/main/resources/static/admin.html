<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 修改位置 1：浏览器标签页显示的标题 -->
    <title>宠物服务管理后台</title>
    <!-- 引入样式 -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <style>
        body { margin: 0; padding: 0; font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", Arial, sans-serif; }
        .el-header { background-color: #304156; color: #fff; line-height: 60px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: bold; }
        .el-aside { background-color: #304156; min-height: 100vh; }
        .el-menu { border-right: none; }
        .el-main { background-color: #f0f2f5; padding: 20px; }
        iframe { width: 100%; height: calc(100vh - 100px); border: none; }
    </style>
</head>
<body>
<div id="app">
    <el-container>
        <el-header>
            <!-- 修改位置 2：页面左上角显示的系统名称 -->
            <div class="logo">PetSaaS 萌宠后台管理</div>
            <div>
                <span style="margin-right: 15px">管理员: {{ username }}</span>
                <el-button type="text" style="color: #fff" @click="logout">退出</el-button>
            </div>
        </el-header>
        <el-container>
            <el-aside width="200px">
                <el-menu
                        default-active="1"
                        class="el-menu-vertical-demo"
                        background-color="#304156"
                        text-color="#bfcbd9"
                        active-text-color="#409EFF"
                        @select="handleSelect">
                    <el-menu-item index="1">
                        <i class="el-icon-s-data"></i>
                        <span slot="title">数据概览</span>
                    </el-menu-item>
                    <el-menu-item index="2">
                        <i class="el-icon-goods"></i>
                        <span slot="title">订单管理</span>
                    </el-menu-item>
                    <el-menu-item index="3">
                        <i class="el-icon-message"></i>
                        <span slot="title">反馈处理</span>
                    </el-menu-item>
                    <el-menu-item index="4">
                        <i class="el-icon-user"></i>
                        <span slot="title">用户管理</span>
                    </el-menu-item>
                </el-menu>
            </el-aside>
            <el-main>
                <div v-if="currentIndex === '1'">
                    <el-card>
                        <div slot="header">
                            <span>今日服务热度</span>
                        </div>
                        <div id="chart" style="width: 100%; height: 400px;"></div>
                    </el-card>
                </div>
                <iframe v-if="currentIndex === '2'" src="order_manage.html"></iframe>
                <iframe v-if="currentIndex === '3'" src="feedback_manage.html"></iframe>
            </el-main>
        </el-container>
    </el-container>
</div>

<!-- Vue & ElementUI & ECharts -->
<script src="https://unpkg.com/vue@2/dist/vue.js"></script>
<script src="https://unpkg.com/element-ui/lib/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

<script>
    new Vue({
        el: '#app',
        data: {
            username: 'admin',
            currentIndex: '1'
        },
        mounted() {
            this.initChart();
        },
        methods: {
            handleSelect(key) {
                this.currentIndex = key;
                if(key === '1') {
                    this.$nextTick(() => {
                        this.initChart();
                    });
                }
            },
            logout() {
                localStorage.removeItem('token');
                window.location.href = '/login.html';
            },
            initChart() {
                const chartDom = document.getElementById('chart');
                if(!chartDom) return;
                const myChart = echarts.init(chartDom);
                // 模拟数据
                const option = {
                    title: { text: '服务预约趋势' },
                    tooltip: { trigger: 'axis' },
                    xAxis: { type: 'category', data: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'] },
                    yAxis: { type: 'value' },
                    series: [{ data: [12, 18, 15, 25, 30, 45, 40], type: 'line', smooth: true }]
                };
                myChart.setOption(option);
            }
        }
    })
</script>
</body>
</html>
