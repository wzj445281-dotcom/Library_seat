<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>商家订单中心 - 智座书局</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <style>
        body { margin: 0; padding: 20px; background: #f0f2f5; font-family: sans-serif; }
        .stat-card { background: #fff; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        .stat-num { font-size: 24px; font-weight: bold; color: #409EFF; }
        .order-card { margin-bottom: 15px; border-left: 5px solid #eee; }
        .order-card.PENDING_PAY { border-left-color: #E6A23C; }
        .order-card.PAID { border-left-color: #409EFF; }
        .order-card.READY { border-left-color: #67C23A; }
        .item-list { font-size: 13px; color: #666; margin: 10px 0; background: #f9f9f9; padding: 8px; }
        .refresh-bar { margin-bottom: 20px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
<div id="app">
    <el-row :gutter="20">
        <el-col :span="6"><div class="stat-card"><div>待处理订单</div><div class="stat-num">{{ pendingCount }}</div></div></el-col>
        <el-col :span="6"><div class="stat-card"><div>今日营业额</div><div class="stat-num">¥{{ todaySales }}</div></div></el-col>
    </el-row>

    <div class="refresh-bar">
        <el-radio-group v-model="activeTab" @change="fetchOrders">
            <el-radio-button label="ALL">全部</el-radio-button>
            <el-radio-button label="PAID">制作中 ({{paidCount}})</el-radio-button>
            <el-radio-button label="READY">待取货 ({{readyCount}})</el-radio-button>
        </el-radio-group>
        <el-button type="success" icon="el-icon-refresh" @click="fetchOrders">刷新</el-button>
    </div>

    <el-table :data="orderList" v-loading="loading" style="width: 100%" :row-key="row => row.id">
        <el-table-column prop="id" label="订单号" width="180"></el-table-column>
        <el-table-column label="类型" width="100">
            <template slot-scope="scope">
                <el-tag :type="scope.row.type === 1 ? '' : 'warning'">{{ scope.row.type === 1 ? '自取' : '外卖' }}</el-tag>
            </template>
        </el-table-column>
        <el-table-column label="商品明细">
            <template slot-scope="scope">
                <div v-for="(item, index) in scope.row.products" :key="index">
                    {{ item.name }} x {{ item.count }}
                </div>
            </template>
        </el-table-column>
        <el-table-column prop="totalAmount" label="金额" width="100">
            <template slot-scope="scope">¥{{ scope.row.totalAmount }}</template>
        </el-table-column>
        <el-table-column label="状态" width="120">
            <template slot-scope="scope">
                <el-tag v-if="scope.row.status==='PENDING_PAY'" type="info">待支付</el-tag>
                <el-tag v-else-if="scope.row.status==='PAID'" type="primary">配货中</el-tag>
                <el-tag v-else-if="scope.row.status==='READY'" type="success">待取/送</el-tag>
                <el-tag v-else type="info">已完成</el-tag>
            </template>
        </el-table-column>
        <el-table-column prop="createTime" label="下单时间" width="160"></el-table-column>
        <el-table-column label="操作" width="200" fixed="right">
            <template slot-scope="scope">
                <!-- 流程：已支付 -> 配货完成 -> 待取货 -> 核销完成 -->
                <el-button v-if="scope.row.status === 'PAID'" type="primary" size="small" @click="changeStatus(scope.row.id, 'READY')">配货完成</el-button>
                <el-button v-if="scope.row.status === 'READY'" type="success" size="small" @click="changeStatus(scope.row.id, 'COMPLETED')">核销/送达</el-button>
            </template>
        </el-table-column>
    </el-table>
</div>

<script src="https://unpkg.com/vue@2/dist/vue.js"></script>
<script src="https://unpkg.com/element-ui/lib/index.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>

<script>
    new Vue({
        el: '#app',
        data: {
            loading: false,
            activeTab: 'PAID',
            pendingCount: 0,
            paidCount: 0,
            readyCount: 0,
            todaySales: '0.00',
            orderList: [],
            timer: null
        },
        mounted() {
            this.fetchOrders();
            // 每30秒自动刷新
            this.timer = setInterval(this.fetchOrders, 30000);
        },
        beforeDestroy() {
            if (this.timer) clearInterval(this.timer);
        },
        methods: {
            fetchOrders() {
                this.loading = true;
                // 尝试调用真实接口
                axios.get('/api/admin/order/list', { params: { status: this.activeTab } })
                    .then(res => {
                        if (res.data && res.data.code === 200) {
                            const data = res.data.data;
                            this.orderList = data.list || [];
                            // 更新统计数据
                            this.pendingCount = data.pendingCount || 0;
                            this.paidCount = data.paidCount || 0;
                            this.readyCount = data.readyCount || 0;
                            this.todaySales = data.todaySales || '0.00';
                        } else {
                            // 接口返回错误或格式不对，降级使用 Mock
                            console.warn("API response invalid, switching to Mock");
                            this.useMockData();
                        }
                    })
                    .catch(err => {
                        console.warn("API Request Failed, using Mock Data", err);
                        this.useMockData();
                    })
                    .finally(() => {
                        this.loading = false;
                    });
            },
            useMockData() {
                console.log("Using Mock Data for tab: " + this.activeTab);
                setTimeout(() => {
                    const allMockData = [
                        {
                            id: 'ORD_2023102601', type: 1, totalAmount: 59.9, status: 'PAID', createTime: '10:20:01',
                            products: [{name: 'Java编程思想', count: 1}]
                        },
                        {
                            id: 'ORD_2023102602', type: 2, totalAmount: 128.0, status: 'READY', createTime: '09:15:33',
                            products: [{name: '算法导论', count: 1}]
                        },
                        {
                            id: 'ORD_2023102603', type: 1, totalAmount: 35.0, status: 'PENDING_PAY', createTime: '10:25:11',
                            products: [{name: '小王子', count: 1}]
                        }
                    ];

                    this.orderList = allMockData.filter(o => this.activeTab === 'ALL' || o.status === this.activeTab);

                    // Mock stats update
                    this.paidCount = allMockData.filter(o => o.status === 'PAID').length;
                    this.readyCount = allMockData.filter(o => o.status === 'READY').length;
                    this.pendingCount = allMockData.filter(o => o.status === 'PENDING_PAY').length;
                    this.todaySales = '1,280.00';

                    this.loading = false;
                }, 500);
            },
            changeStatus(orderId, nextStatus) {
                this.$confirm(`确认更改订单状态为 ${nextStatus}?`, '操作确认', {
                    confirmButtonText: '确定',
                    type: 'warning'
                }).then(() => {
                    axios.post('/api/admin/order/status', { id: orderId, status: nextStatus })
                        .then(res => {
                            if (res.data && res.data.code === 200) {
                                this.$message.success('操作成功');
                                this.fetchOrders(); // 刷新列表
                            } else {
                                this.mockChangeStatus(orderId);
                            }
                        })
                        .catch(() => {
                            this.mockChangeStatus(orderId);
                        });
                });
            },
            mockChangeStatus(orderId) {
                this.$message.success('操作成功 (Mock)');
                const idx = this.orderList.findIndex(o => o.id === orderId);
                if(idx !== -1) {
                    // 简单模拟移除，因为状态变了，不在当前 Tab 显示了
                    this.orderList.splice(idx, 1);

                    // 简单更新计数
                    if (this.activeTab === 'PAID') this.paidCount = Math.max(0, this.paidCount - 1);
                    if (this.activeTab === 'READY') this.readyCount = Math.max(0, this.readyCount - 1);
                }
            }
        }
    })
</script>
</body>
</html>
