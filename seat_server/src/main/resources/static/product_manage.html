<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理 - 瑞幸咖啡后台</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Vue 2 & Axios -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* 侧边栏样式 (与首页保持一致) */
        .sidebar {
            height: 100vh;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            color: white;
            padding-top: 20px;
            position: fixed;
            width: 250px;
            z-index: 1000;
        }
        .sidebar-brand {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 40px;
            color: #38bdf8;
            letter-spacing: 2px;
        }
        .nav-link {
            color: #94a3b8;
            padding: 15px 25px;
            font-size: 16px;
            transition: all 0.3s;
        }
        .nav-link:hover, .nav-link.active {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.1);
            border-left: 4px solid #38bdf8;
        }
        .nav-link i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }
        /* 主内容区域 */
        .main-content {
            margin-left: 250px;
            padding: 30px;
        }
        /* 表格样式 */
        .card {
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-radius: 12px;
        }
        .table thead th {
            border-top: none;
            background-color: #f8f9fa;
            color: #6c757d;
            font-weight: 600;
        }
        .product-img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            background-color: #eee;
        }
        .action-btn {
            cursor: pointer;
            margin-right: 10px;
            transition: color 0.2s;
        }
        .action-btn:hover {
            color: #0d6efd;
        }
        .action-btn.delete:hover {
            color: #dc3545;
        }
    </style>
</head>
<body>
<div id="app">
    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-couch me-2"></i>ZHIZUO
        </div>
        <nav class="nav flex-column">
            <a class="nav-link" href="/admin.html">
                <i class="fas fa-home"></i> 首页概览
            </a>
            <a class="nav-link" href="/monitor.html" target="_blank">
                <i class="fas fa-chart-line"></i> AI 监控大屏
            </a>
            <!-- 当前页面高亮 -->
            <a class="nav-link active" href="/product_manage.html">
                <i class="fas fa-coffee"></i> 商品管理
            </a>
            <a class="nav-link" href="/store_order_manage.html">
                <i class="fas fa-clipboard-list"></i> 订单管理
            </a>
            <a class="nav-link" href="/feedback_manage.html">
                <i class="fas fa-comment-dots"></i> 用户反馈
            </a>
        </nav>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark">商品菜单管理</h2>
            <button class="btn btn-primary" @click="openAddModal">
                <i class="fas fa-plus me-2"></i>新增商品
            </button>
        </div>

        <!-- 搜索栏 -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" class="form-control" v-model="searchKeyword" placeholder="搜索商品名称...">
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" v-model="filterCategory">
                            <option value="">所有分类</option>
                            <option value="coffee">咖啡</option>
                            <option value="tea">茶饮</option>
                            <option value="snack">甜点</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-outline-secondary w-100" @click="fetchData">搜索</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 商品表格 -->
        <div class="card">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4">缩略图</th>
                        <th>商品名称</th>
                        <th>分类</th>
                        <th>价格</th>
                        <th>库存</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr v-for="item in productList" :key="item.id">
                        <td class="ps-4">
                            <img :src="item.image || 'https://via.placeholder.com/50'" class="product-img" alt="商品图片">
                        </td>
                        <td>{{ item.name }}</td>
                        <td>
                            <span class="badge bg-light text-dark border">{{ item.category }}</span>
                        </td>
                        <td class="fw-bold text-danger">¥ {{ item.price }}</td>
                        <td>{{ item.stock }}</td>
                        <td>
                                    <span class="badge" :class="item.stock > 10 ? 'bg-success' : 'bg-warning'">
                                        {{ item.stock > 10 ? '充足' : '低库存' }}
                                    </span>
                        </td>
                        <td>
                            <i class="fas fa-edit action-btn text-primary" title="编辑" @click="editItem(item)"></i>
                            <i class="fas fa-trash-alt action-btn delete text-danger" title="删除" @click="deleteItem(item.id)"></i>
                        </td>
                    </tr>
                    <tr v-if="productList.length === 0">
                        <td colspan="7" class="text-center py-5 text-muted">暂无数据</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 编辑/新增 弹窗 Modal -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">{{ isEdit ? '编辑商品' : '新增商品' }}</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">商品名称</label>
                            <input type="text" class="form-control" v-model="form.name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">价格 (¥)</label>
                            <input type="number" class="form-control" v-model="form.price">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">库存</label>
                            <input type="number" class="form-control" v-model="form.stock">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">分类</label>
                            <select class="form-select" v-model="form.category">
                                <option value="coffee">咖啡</option>
                                <option value="tea">茶饮</option>
                                <option value="snack">甜点</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">图片链接</label>
                            <input type="text" class="form-control" v-model="form.image" placeholder="http://...">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" @click="saveProduct">保存</button>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- 引入 Bootstrap JS (用于弹窗) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    new Vue({
        el: '#app',
        data: {
            searchKeyword: '',
            filterCategory: '',
            productList: [],
            modalInstance: null,
            isEdit: false,
            form: {
                id: null,
                name: '',
                price: 0,
                stock: 0,
                category: 'coffee',
                image: ''
            }
        },
        mounted() {
            // 初始化 Modal 对象
            this.modalInstance = new bootstrap.Modal(document.getElementById('productModal'));
            this.fetchData();
        },
        methods: {
            // 加载数据 (模拟数据，实际项目中请替换为 axios.get('/api/admin/products'))
            fetchData() {
                // 模拟从后端获取的数据
                const mockData = [
                    { id: 1, name: '拿铁咖啡 (Latte)', category: 'coffee', price: 28, stock: 150, image: 'https://images.unsplash.com/photo-1570968992193-d6ea066f8737?auto=format&fit=crop&w=100&q=80' },
                    { id: 2, name: '卡布奇诺 (Cappuccino)', category: 'coffee', price: 32, stock: 80, image: 'https://images.unsplash.com/photo-1572442388796-11668a67e53d?auto=format&fit=crop&w=100&q=80' },
                    { id: 3, name: '茉莉花茶', category: 'tea', price: 18, stock: 5, image: 'https://images.unsplash.com/photo-1627435601361-ec25f5b1d0e5?auto=format&fit=crop&w=100&q=80' },
                    { id: 4, name: '草莓芝士蛋糕', category: 'snack', price: 35, stock: 20, image: 'https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=100&q=80' }
                ];

                // 简单的前端筛选模拟
                this.productList = mockData.filter(item => {
                    const matchKey = item.name.includes(this.searchKeyword);
                    const matchCat = this.filterCategory ? item.category === this.filterCategory : true;
                    return matchKey && matchCat;
                });
            },

            // 打开新增弹窗
            openAddModal() {
                this.isEdit = false;
                this.form = { id: null, name: '', price: 0, stock: 0, category: 'coffee', image: '' };
                this.modalInstance.show();
            },

            // 打开编辑弹窗
            editItem(item) {
                this.isEdit = true;
                this.form = { ...item }; // 浅拷贝
                this.modalInstance.show();
            },

            // 保存数据
            saveProduct() {
                // TODO: 这里调用后端接口 axios.post('/api/admin/product/save', this.form)

                if (this.isEdit) {
                    // 模拟前端更新
                    const index = this.productList.findIndex(p => p.id === this.form.id);
                    if (index !== -1) {
                        this.$set(this.productList, index, { ...this.form });
                    }
                } else {
                    // 模拟前端新增
                    this.form.id = Date.now();
                    this.productList.unshift({ ...this.form });
                }

                this.modalInstance.hide();
                alert('保存成功 (演示模式)');
            },

            // 删除数据
            deleteItem(id) {
                if (confirm('确定要下架该商品吗？')) {
                    // TODO: 调用后端接口 axios.delete('/api/admin/product/' + id)
                    this.productList = this.productList.filter(item => item.id !== id);
                }
            }
        }
    });
</script>
</body>
</html>
