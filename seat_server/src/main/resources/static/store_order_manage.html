<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>瑞幸咖啡 - 订单履约</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        body { margin: 0; background-color: #f0f2f5; font-family: sans-serif; }
        .header { background: #fff; padding: 0 20px; height: 60px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .container { max-width: 1200px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 4px; }
        .status-tag { font-weight: bold; }
    </style>
</head>
<body>
<div id="app">
    <div class="header">
        <h2 style="color: #1890ff; margin: 0;">🚚 订单履约工作台</h2>
        <el-button type="text" @click="goHome">返回首页</el-button>
    </div>

    <div class="container">
        <el-tabs v-model="activeStatus" @tab-click="fetchOrders">
            <el-tab-pane label="待处理 (Pending)" name="PENDING"></el-tab-pane>
            <el-tab-pane label="制作中 (Making)" name="MAKING"></el-tab-pane>
            <el-tab-pane label="已完成 (Completed)" name="COMPLETED"></el-tab-pane>
            <el-tab-pane label="全部订单" name=""></el-tab-pane>
        </el-tabs>

        <el-table :data="tableData" v-loading="loading" style="width: 100%; margin-top: 20px;">
            <el-table-column prop="orderNo" label="订单号" width="180"></el-table-column>
            <el-table-column prop="resourceId" label="资源ID" width="100"></el-table-column>
            <el-table-column label="履约方式" width="120">
                <template slot-scope="scope">
                    <el-tag :type="scope.row.deliveryType===1?'warning':'info'">
                        {{ scope.row.deliveryType===1 ? '配送到座' : '自取' }}
                    </el-tag>
                </template>
            </el-table-column>
            <el-table-column prop="seatId" label="配送地址" width="100">
                <template slot-scope="scope">
                    {{ scope.row.seatId ? scope.row.seatId : '-' }}
                </template>
            </el-table-column>
            <el-table-column label="状态" width="120">
                <template slot-scope="scope">
                    <el-tag class="status-tag" :type="getStatusType(scope.row.status)">
                        {{ scope.row.status }}
                    </el-tag>
                </template>
            </el-table-column>
            <el-table-column prop="createTime" label="申请时间" width="180"></el-table-column>

            <el-table-column label="操作" fixed="right" width="200">
                <template slot-scope="scope">
                    <!-- 待处理 -> 发货 -->
                    <el-button v-if="scope.row.status === 'PENDING'"
                               type="primary" size="mini"
                               @click="processOrder(scope.row.id, 'DELIVER')">
                        {{ scope.row.deliveryType===1 ? '开始配送' : '确认取货' }}
                    </el-button>

                    <!-- 使用中 -> 归还 -->
                    <el-button v-if="scope.row.status === 'USING'"
                               type="success" size="mini"
                               @click="processOrder(scope.row.id, 'RETURN')">
                        确认归还
                    </el-button>
                </template>
            </el-table-column>
        </el-table>
    </div>
</div>

<script>
    new Vue({
        el: '#app',
        data: {
            activeStatus: 'PENDING',
            tableData: [],
            loading: false
        },
        created() {
            this.fetchOrders();
        },
        methods: {
            goHome() { window.location.href = '/admin.html'; },
            fetchOrders() {
                this.loading = true;
                axios.get('/api/admin/resources/orders', { params: { status: this.activeStatus } })
                    .then(res => {
                        if (res.data.code === 200) {
                            this.tableData = res.data.data;
                        }
                    })
                    .finally(() => this.loading = false);
            },
            processOrder(id, action) {
                const tip = action === 'DELIVER' ? '确认该物品已交付给学生？' : '确认物品已归还并检查无误？';
                this.$confirm(tip, '提示', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' })
                    .then(() => {
                        axios.post(`/api/admin/resources/orders/${id}/process?action=${action}`)
                            .then(res => {
                                if (res.data.code === 200) {
                                    this.$message.success('操作成功');
                                    this.fetchOrders();
                                } else {
                                    this.$message.error(res.data.message);
                                }
                            });
                    });
            },
            getStatusType(status) {
                if (status === 'PENDING') return 'warning';
                if (status === 'USING') return 'primary';
                if (status === 'RETURNED') return 'success';
                return 'info';
            }
        }
    });
</script>
</body>
</html>
