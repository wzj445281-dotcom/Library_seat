<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智座 - 智能管理后台</title>
    <!-- 引入 Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Font Awesome 图标 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .sidebar {
            height: 100vh;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            color: white;
            padding-top: 20px;
            position: fixed;
            width: 250px;
        }
        .sidebar-brand {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 40px;
            color: #38bdf8;
            letter-spacing: 2px;
        }
        .nav-link {
            color: #94a3b8;
            padding: 15px 25px;
            font-size: 16px;
            transition: all 0.3s;
        }
        .nav-link:hover, .nav-link.active {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.1);
            border-left: 4px solid #38bdf8;
        }
        .nav-link i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }
        .main-content {
            margin-left: 250px;
            padding: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            border: none;
            height: 100%;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 15px;
        }
        .feature-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .feature-card:hover {
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        .feature-icon {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
        }
        .feature-body {
            padding: 20px;
        }
        .feature-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 5px;
        }
        .feature-desc {
            color: #6c757d;
            font-size: 14px;
        }
    </style>
</head>
<body>

<!-- 侧边栏 -->
<div class="sidebar">
    <div class="sidebar-brand">
        <i class="fas fa-couch me-2"></i>ZHIZUO
    </div>
    <nav class="nav flex-column">
        <a class="nav-link active" href="/admin.html">
            <i class="fas fa-home"></i> 首页概览
        </a>
        <a class="nav-link" href="/monitor.html" target="_blank">
            <i class="fas fa-chart-line"></i> AI 监控大屏
        </a>
        <a class="nav-link" href="/product_manage.html">
            <i class="fas fa-coffee"></i> 商品管理
        </a>
        <a class="nav-link" href="/store_order_manage.html">
            <i class="fas fa-clipboard-list"></i> 订单管理
        </a>
        <a class="nav-link" href="/feedback_manage.html">
            <i class="fas fa-comment-dots"></i> 用户反馈
        </a>
    </nav>
</div>

<!-- 主内容区 -->
<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark">管理控制台</h2>
        <div class="text-muted">
            <i class="far fa-calendar-alt me-1"></i> <span id="current-date">2025-12-25</span>
        </div>
    </div>

    <!-- 顶部数据卡片 -->
    <div class="row g-4 mb-5">
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon bg-primary bg-opacity-10 text-primary">
                    <i class="fas fa-users"></i>
                </div>
                <h3 class="fw-bold">1,204</h3>
                <p class="text-muted mb-0">总用户数</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon bg-success bg-opacity-10 text-success">
                    <i class="fas fa-chair"></i>
                </div>
                <h3 class="fw-bold">85%</h3>
                <p class="text-muted mb-0">当前入座率</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon bg-warning bg-opacity-10 text-warning">
                    <i class="fas fa-shopping-bag"></i>
                </div>
                <h3 class="fw-bold">¥ 3,450</h3>
                <p class="text-muted mb-0">今日营业额</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon bg-info bg-opacity-10 text-info">
                    <i class="fas fa-robot"></i>
                </div>
                <h3 class="fw-bold">156</h3>
                <p class="text-muted mb-0">AI 交互次数</p>
            </div>
        </div>
    </div>

    <h4 class="fw-bold mb-4">快捷入口</h4>
    <div class="row g-4">
        <!-- 监控大屏入口 -->
        <div class="col-md-4">
            <a href="/monitor.html" target="_blank" class="feature-card">
                <div class="feature-icon bg-dark">
                    <i class="fas fa-chart-pie"></i>
                </div>
                <div class="feature-body">
                    <div class="feature-title">AI 实时监控大屏</div>
                    <div class="feature-desc">查看座位热力图、实时拥挤度预测曲线。</div>
                </div>
            </a>
        </div>

        <!-- 商品管理入口 -->
        <div class="col-md-4">
            <a href="/product_manage.html" class="feature-card">
                <div class="feature-icon bg-primary">
                    <i class="fas fa-coffee"></i>
                </div>
                <div class="feature-body">
                    <div class="feature-title">商品菜单管理</div>
                    <div class="feature-desc">管理咖啡、饮品及库存信息。</div>
                </div>
            </a>
        </div>

        <!-- 订单管理入口 -->
        <div class="col-md-4">
            <a href="/store_order_manage.html" class="feature-card">
                <div class="feature-icon bg-success">
                    <i class="fas fa-file-invoice"></i>
                </div>
                <div class="feature-body">
                    <div class="feature-title">店铺订单处理</div>
                    <div class="feature-desc">查看并处理用户的点单需求。</div>
                </div>
            </a>
        </div>
    </div>
</div>

<script>
    // 设置当前日期
    document.getElementById('current-date').textContent = new Date().toLocaleDateString();
</script>
</body>
</html>
