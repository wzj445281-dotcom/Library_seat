<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑞幸咖啡 AI 实时监控中心</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #0b1120; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .header { padding: 20px; text-align: center; background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%); border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 24px; color: #38bdf8; }
        .container { padding: 20px; display: grid; grid-template-columns: 2fr 1fr; gap: 20px; height: calc(100vh - 100px); }
        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; }
        .card-header { font-size: 18px; margin-bottom: 15px; color: #94a3b8; border-left: 4px solid #38bdf8; padding-left: 10px; display: flex; justify-content: space-between; }
        #chart-prediction { flex: 1; width: 100%; min-height: 300px; }
        .ai-log { flex: 1; background: #0f172a; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 12px; overflow-y: auto; color: #22c55e; border: 1px solid #334155; }
        .log-item { margin-bottom: 5px; border-bottom: 1px dashed #334155; }
        .predict-value { font-size: 32px; color: #38bdf8; font-weight: bold; }
        .predict-label { font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>
<div id="app">
    <div class="header">
        <h1>RUIXING AI MONITOR <small style="font-size: 14px;">Intelligent System</small></h1>
        <div style="text-align: right;">
            <div class="predict-value">{{ (currentPrediction * 100).toFixed(1) }}%</div>
            <div class="predict-label">未来1小时拥挤度预测</div>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <span>门店客流趋势预测 (Next 1 Hour)</span>
                <span style="font-size: 12px; color: #64748b;">Model: LSTM-v2</span>
            </div>
            <div id="chart-prediction"></div>
        </div>

        <div class="card">
            <div class="card-header">AI 决策日志</div>
            <div class="ai-log" id="log-container">
                <div class="log-item" v-for="(log, index) in logs" :key="index">
                    <span style="color: #64748b;">[{{ log.time }}]</span> {{ log.message }}
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    new Vue({
        el: '#app',
        data: {
            logs: [],
            chartInstance: null,
            predictionData: [],
            xAxisData: [],
            currentPrediction: 0
        },
        mounted() {
            this.initChart();
            this.addLog("系统启动...");
            // 每 3 秒获取一次最新预测
            setInterval(this.fetchPrediction, 3000);
        },
        methods: {
            addLog(msg) {
                const time = new Date().toLocaleTimeString();
                this.logs.unshift({ time, message: msg });
                if (this.logs.length > 50) this.logs.pop();
            },
            initChart() {
                this.chartInstance = echarts.init(document.getElementById('chart-prediction'));
                // 初始化空图表配置
                this.chartInstance.setOption({
                    backgroundColor: 'transparent',
                    tooltip: { trigger: 'axis' },
                    grid: { top: '15%', left: '3%', right: '4%', bottom: '3%', containLabel: true },
                    xAxis: { type: 'category', boundaryGap: false, data: [], axisLine: { lineStyle: { color: '#94a3b8' } } },
                    yAxis: { type: 'value', min: 0, max: 1, splitLine: { lineStyle: { color: '#334155', type: 'dashed' } }, axisLine: { lineStyle: { color: '#94a3b8' } } },
                    series: [{
                        name: '预测拥挤度', type: 'line', smooth: true, symbol: 'none',
                        areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(56, 189, 248, 0.5)' }, { offset: 1, color: 'rgba(56, 189, 248, 0.0)' }]) },
                        lineStyle: { color: '#38bdf8', width: 3 },
                        data: []
                    }]
                });
                window.addEventListener('resize', () => this.chartInstance.resize());
            },
            fetchPrediction() {
                // 调用后端接口获取预测值
                axios.get('/api/app/ai/prediction/crowding').then(res => {
                    if (res.data.code === 200) {
                        const value = res.data.data;
                        this.currentPrediction = value;
                        const now = new Date().toLocaleTimeString();

                        this.addLog(`AI Model Output: Crowding Index ${value}`);

                        if (this.xAxisData.length > 20) {
                            this.xAxisData.shift();
                            this.predictionData.shift();
                        }
                        this.xAxisData.push(now);
                        this.predictionData.push(value);

                        this.chartInstance.setOption({
                            xAxis: { data: this.xAxisData },
                            series: [{ data: this.predictionData }]
                        });
                    }
                }).catch(err => this.addLog("连接 AI 服务失败: " + err.message));
            }
        }
    });
</script>
</body>
</html>
