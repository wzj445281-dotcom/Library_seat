server:
  port: 8080

spring:
  application:
    name: ruixing-coffee-server
  
  # Thymeleaf 配置（前后端一体化）
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false  # 开发环境关闭缓存，生产环境改为true
  
  # 禁用 RabbitMQ 自动配置（如果本地没有安装RabbitMQ，取消下面的注释）
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/zhizuo?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:000000}

  # Redis 配置 (Day 1)
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    database: 0
    timeout: 10000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1
        max-idle: 8
        min-idle: 0

  # Jackson 日期格式化
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# --- AI 配置 (DeepSeek) ---
ai:
  deepseek:
    key: ${AI_DEEPSEEK_KEY:}
    url: ${AI_DEEPSEEK_URL:https://api.deepseek.com/chat/completions}
    model: ${AI_DEEPSEEK_MODEL:deepseek-chat}
  service:
    url: ${AI_SERVICE_URL:http://localhost:5000}

# MyBatis Plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    com.example.zhizuo: debug
    org.springframework.web: info
