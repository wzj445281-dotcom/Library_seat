server:
  port: 8080

spring:
  application:
    name: ruixing-coffee-server
  
  # 禁用 RabbitMQ 自动配置（如果本地没有安装RabbitMQ，取消下面的注释）
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 注意：本地运行时用 localhost:3306/ruixing，Docker 运行时会被环境变量覆盖为 mysql:3306/ruixing_db
    # 支持通过环境变量 SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD 覆盖
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ruixing?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:000000}

  # Redis 配置 (Day 1)
  redis:
    # 支持通过环境变量 SPRING_REDIS_HOST, SPRING_REDIS_PORT 覆盖
    # Docker 运行时会被环境变量覆盖为 ruixing-redis
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    database: 0
    timeout: 10000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1
        max-idle: 8
        min-idle: 0

  # RabbitMQ 配置 (Day 2)
  # 如果本地没有安装RabbitMQ，请注释掉下面的配置（已在上面的autoconfigure.exclude中禁用）
  # 如果需要使用RabbitMQ，请：
  # 1. 注释掉上面的 autoconfigure.exclude 配置
  # 2. 取消下面配置的注释
  # 3. 确保RabbitMQ服务已启动
  # rabbitmq:
  #   host: ${SPRING_RABBITMQ_HOST:localhost}
  #   port: ${SPRING_RABBITMQ_PORT:5672}
  #   username: ${SPRING_RABBITMQ_USERNAME:guest}
  #   password: ${SPRING_RABBITMQ_PASSWORD:guest}
  #   virtual-host: /
  #   listener:
  #     simple:
  #       acknowledge-mode: manual
  #       prefetch: 1

  # Jackson 日期格式化
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# --- AI 配置 (DeepSeek) ---
ai:
  deepseek:
    # 填入你的 API Key (支持通过环境变量 AI_DEEPSEEK_KEY 覆盖)
    # 注意：这里不要填写URL，应该填写实际的API Key，格式如：sk-xxxxxxxxxxxxxxxxxxxxxxxx
    key: ${AI_DEEPSEEK_KEY:}
    url: ${AI_DEEPSEEK_URL:https://api.deepseek.com/chat/completions}
    model: ${AI_DEEPSEEK_MODEL:deepseek-chat}
  # Python AI 服务地址 (支持通过环境变量 AI_SERVICE_URL 覆盖)
  service:
    url: ${AI_SERVICE_URL:http://localhost:5000}

# MyBatis Plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开启 SQL 日志打印
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted # 逻辑删除字段(如果有)
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    com.example.ruixing: debug
    org.springframework.web: info