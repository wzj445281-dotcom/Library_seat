<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - 瑞幸咖啡</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        .orders-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .order-item {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .order-no {
            font-size: 12px;
            color: var(--text-light);
        }
        .order-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
        }
        .status-paid { background: #e6f7ff; color: #1890ff; }
        .status-ready { background: #f6ffed; color: #52c41a; }
        .status-completed { background: #f0f0f0; color: #999; }
        .order-products {
            margin-bottom: 15px;
        }
        .product-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
        }
        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .order-total {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary-color);
        }
        .order-actions {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/" class="navbar-brand">☕ 瑞幸咖啡</a>
        <ul class="navbar-nav">
            <li><a href="/">首页</a></li>
            <li><a href="/menu">点餐</a></li>
            <li><a href="/orders" class="active">订单</a></li>
            <li><a href="/mine">我的</a></li>
        </ul>
    </div>

    <div class="orders-container">
        <h2 style="margin-bottom: 20px;">我的订单</h2>
        <div id="ordersList">
            <div class="loading">加载中...</div>
        </div>
    </div>

    <script th:src="@{/js/api.js}"></script>
    <script>
        function loadOrders() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/login';
                return;
            }
            
            api.get('/app/order/list').then(res => {
                if (res.code === 200) {
                    renderOrders(res.data || []);
                }
            }).catch(err => {
                console.error('加载订单失败:', err);
                document.getElementById('ordersList').innerHTML = '<div class="loading">加载失败，请刷新重试</div>';
            });
        }
        
        function renderOrders(orders) {
            const container = document.getElementById('ordersList');
            if (!orders || orders.length === 0) {
                container.innerHTML = '<div class="loading">暂无订单</div>';
                return;
            }
            
            container.innerHTML = orders.map(order => {
                const statusMap = {
                    'PENDING': { text: '待支付', class: 'status-paid' },
                    'PAID': { text: '制作中', class: 'status-paid' },
                    'READY': { text: '待取餐', class: 'status-ready' },
                    'COMPLETED': { text: '已完成', class: 'status-completed' },
                    'CANCELLED': { text: '已取消', class: 'status-completed' }
                };
                const status = statusMap[order.status] || { text: order.status, class: 'status-paid' };
                
                return `
                    <div class="order-item">
                        <div class="order-header">
                            <div>
                                <div style="font-weight: bold; margin-bottom: 5px;">订单号：${order.orderNo}</div>
                                <div class="order-no">${order.createTime || ''}</div>
                            </div>
                            <span class="order-status ${status.class}">${status.text}</span>
                        </div>
                        <div class="order-products">
                            ${(order.products || []).map(p => `
                                <div class="product-row">
                                    <span>${p.productName} x${p.quantity}</span>
                                    <span>¥${p.price}</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="order-footer">
                            <div class="order-total">实付：¥${order.totalAmount || 0}</div>
                            <div class="order-actions">
                                <button class="btn" onclick="viewDetail('${order.orderNo}')">查看详情</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function viewDetail(orderNo) {
            window.location.href = `/order/detail?orderNo=${orderNo}`;
        }
        
        loadOrders();
    </script>
</body>
</html>
