<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 瑞幸咖啡</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-color);
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .switch-mode {
            text-align: center;
            margin-top: 20px;
            color: var(--text-light);
        }
        .switch-mode a {
            color: var(--primary-color);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>☕ 瑞幸咖啡</h1>
            <p id="loginTitle">欢迎登录</p>
        </div>
        
        <form id="loginForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label>手机号</label>
                <input type="tel" id="phone" placeholder="请输入手机号" required>
            </div>
            
            <div class="form-group" id="nameGroup" style="display: none;">
                <label>姓名</label>
                <input type="text" id="name" placeholder="请输入姓名">
            </div>
            
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">登录</button>
        </form>
        
        <div class="switch-mode">
            <a href="#" onclick="switchMode(event)">没有账号？去注册</a>
        </div>
    </div>

    <script th:src="@{/js/api.js}"></script>
    <script>
        let isRegister = false;
        
        function switchMode(e) {
            e.preventDefault();
            isRegister = !isRegister;
            document.getElementById('loginTitle').textContent = isRegister ? '欢迎注册' : '欢迎登录';
            document.getElementById('nameGroup').style.display = isRegister ? 'block' : 'none';
            document.getElementById('submitBtn').textContent = isRegister ? '注册' : '登录';
            document.querySelector('.switch-mode a').textContent = isRegister ? '已有账号？去登录' : '没有账号？去注册';
        }
        
        function handleSubmit(e) {
            e.preventDefault();
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;
            
            if (isRegister) {
                if (!name) {
                    alert('请输入姓名');
                    return;
                }
                api.post('/app/auth/register', { phone, name, password }).then(res => {
                    alert('注册成功');
                    switchMode({ preventDefault: () => {} });
                });
            } else {
                api.post('/app/auth/login', { phone, password }).then(res => {
                    if (res.data && res.data.token) {
                        localStorage.setItem('token', res.data.token);
                        window.location.href = '/';
                    }
                });
            }
        }
    </script>
</body>
</html>
