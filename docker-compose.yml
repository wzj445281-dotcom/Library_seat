services:
  # 1. AI 服务 (Python)
  ai-service:
    build: ./ai_service
    container_name: zhizuo-ai
    ports:
      - "5001:5000" # 映射到宿主机 5001，防止 5000 冲突
    environment:
      - DEEPSEEK_API_KEY=sk-xxxxxxxxxxxxxxxxxxxxxxxx # 【必填】记得填 Key
    networks:
      - zhizuo-net
    restart: always

  # 2. 数据库 (MySQL)
  mysql:
    image: mysql:8.0
    container_name: zhizuo-db
    ports:
      - "3307:3306" # 映射到宿主机 3307，防止 3306 冲突
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zhizuo_db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - zhizuo-net
    restart: always

  # 3. 缓存 (Redis) - 【新增】
  redis:
    image: redis:6.2
    container_name: zhizuo-redis
    ports:
      - "6380:6379" # 映射到宿主机 6380，防止 6379 冲突
    networks:
      - zhizuo-net
    restart: always

  # 4. 消息队列 (RabbitMQ) - 【新增】
  rabbitmq:
    image: rabbitmq:3.8-management
    container_name: zhizuo-rabbitmq
    ports:
      - "5673:5672"   # 应用端口映射到 5673
      - "15673:15672" # 管理界面映射到 15673
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - zhizuo-net
    restart: always

  # 5. 后端服务 (Java Spring Boot)
  seat-server:
    build: ./seat_server
    container_name: zhizuo-server
    ports:
      - "8081:8080" # 映射到宿主机 8081
    depends_on:
      - ai-service
      - mysql
      - redis
      - rabbitmq
    environment:
      # === 数据库连接 ===
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/zhizuo_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      # === AI 服务连接 ===
      AI_SERVICE_URL: http://ai-service:5000

      # === Redis 连接 (使用容器名 redis) ===
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379

      # === RabbitMQ 连接 (使用容器名 rabbitmq) ===
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      
      # === DeepSeek API Key (可选，如果不配置将使用Mock模式) ===
      AI_DEEPSEEK_KEY: ${DEEPSEEK_API_KEY:-}
    networks:
      - zhizuo-net
    restart: always

networks:
  zhizuo-net:
    driver: bridge

volumes:
  mysql-data: