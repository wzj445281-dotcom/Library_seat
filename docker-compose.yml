version: '3.8'

services:
  # 1. 数据库服务 (MySQL)
  mysql:
    image: mysql:8.0
    container_name: zhizuo-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "000000"  # 务必与 application.yml 保持一致
      MYSQL_DATABASE: zhizuo
      MYSQL_TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./seat_server/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    networks:
      - zhizuo-net

  # 2. 缓存服务 (Redis)
  redis:
    image: redis:6.2
    container_name: zhizuo-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zhizuo-net

  # 3. 消息队列 (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: zhizuo-rabbitmq
    restart: always
    ports:
      - "5672:5672"   # 应用连接端口
      - "15672:15672" # 管理界面端口
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - zhizuo-net

  # 4. Java 后端服务
  server:
    build: ./seat_server
    container_name: zhizuo-server
    restart: on-failure
    depends_on:
      - mysql
      - redis
      - rabbitmq
    ports:
      - "8080:8080"
    environment:
      # 覆盖 application.yml 中的配置，使用容器服务名连接
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/zhizuo?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      # 如果需要连接 AI 服务
      AI_SERVICE_URL: http://ai-service:5000
    networks:
      - zhizuo-net

  # 5. Python AI 服务 (如果有)
  ai-service:
    build: ./ai_service
    container_name: zhizuo-ai
    restart: on-failure
    ports:
      - "5000:5000"
    networks:
      - zhizuo-net

volumes:
  mysql_data:
  redis_data:

networks:
  zhizuo-net:
    driver: bridge