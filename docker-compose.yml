version: '3.8'

services:
  # 1. MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: zhizuo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "000000"  # 对应 Java 里的密码
      MYSQL_DATABASE: zhizuo
    ports:
      - "3306:3306"
    volumes:
      # 自动初始化 SQL 脚本
      - ./seat_server/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  # 2. Redis 缓存
  redis:
    image: redis:alpine
    container_name: zhizuo-redis
    ports:
      - "6379:6379"

  # 3. RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:management
    container_name: zhizuo-rabbitmq
    ports:
      - "5672:5672"   # Java 连接端口
      - "15672:15672" # Web 管理端口
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # 4. Python AI 服务
  ai-service:
    build: ./ai_service
    container_name: zhizuo-ai
    ports:
      - "5000:5000"

  # 5. Java 后端核心 (最后启动)
  seat-server:
    build: ./seat_server
    container_name: zhizuo-backend
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - ai-service
    environment:
      # 覆盖 application.yml 中的 localhost 配置
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/zhizuo?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_PASSWORD: "root"
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq

volumes:
  mysql_data: